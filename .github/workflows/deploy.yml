name: Deploy to E2E Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "--- Ensuring network MTU allows GitHub connection ---"
            ip link set dev enp3s0 mtu 1350 2>/dev/null || true

            echo "--- Navigating to project directory ---"
            cd "${{ secrets.TARGET_DIR || '/var/www/nubibill-backend' }}"
            
            echo "--- Pulling latest code from GitHub main branch ---"
            git pull origin main
            
            echo "--- Updating running Docker container ---"
            docker cp /var/www/nubibill-backend/. nubibill-backend:/var/www/html/
            
            echo "--- Running Database Migrations inside Container ---"
            docker exec nubibill-backend php artisan migrate --force
            
            echo "--- Clearing and Caching inside Container ---"
            docker exec nubibill-backend php artisan optimize:clear
            
            echo "--- Deployment successfully completed! ---"
